<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
<title id="title">Maneesha Venigalla</title>
<desc id="desc">I build things. Then I build other things. Crooked desktop windows, an indecisive progress bar, and a rabbit peeking over the edge.</desc>
<defs>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r=".8" fill="#70667b" opacity=".13"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="0" flood-color="#3c3347" flood-opacity=".12"/></filter>
</defs>
<rect x="1" y="1" width="1098" height="348" rx="18" fill="#f5f1e9" stroke="#d5cedb"/>
<rect x="2" y="2" width="1096" height="346" rx="17" fill="url(#dots)"/>
<!-- A small, increasingly crowded desktop. -->
<g transform="translate(40 70) rotate(-9 75 55)" filter="url(#shadow)">
 <rect width="150" height="111" rx="8" fill="#e7def0" stroke="#746580" stroke-width="1.4"/>
 <path d="M0 25H150" stroke="#746580"/>
 <g fill="#9c88af"><circle cx="13" cy="13" r="3"/><circle cx="25" cy="13" r="3"/><circle cx="37" cy="13" r="3"/></g>
 <path d="m39 51-13 12 13 12m66-24 13 12-13 12M83 44 68 83" fill="none" stroke="#746580" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(116 198) rotate(7 73 47)">
 <g filter="url(#shadow)">
  <animateTransform attributeName="transform" type="translate" values="0 0;-12 -6;-12 -6;0 0;0 0" keyTimes="0;.3;.55;.8;1" dur="12s" repeatCount="indefinite"/>
  <rect width="148" height="92" rx="8" fill="#f0d9d5" stroke="#8e777c" stroke-width="1.4"/>
  <path d="M0 23H148" stroke="#8e777c"/>
  <g fill="#b99195"><circle cx="13" cy="12" r="3"/><circle cx="25" cy="12" r="3"/><circle cx="37" cy="12" r="3"/></g>
  <rect x="18" y="42" width="109" height="5" rx="2.5" fill="#b99195" opacity=".6"/>
  <rect x="18" y="56" width="76" height="5" rx="2.5" fill="#b99195" opacity=".4"/>
  <rect x="18" y="70" width="91" height="5" rx="2.5" fill="#b99195" opacity=".4"/>
 </g>
</g>
<!-- Rabbit stays mostly behind the window, as a rabbit should. -->
<g transform="translate(937 165)">
 <animateTransform attributeName="transform" type="translate" values="937 165;937 165;937 152;937 152;937 165" keyTimes="0;.35;.5;.75;1" dur="9s" repeatCount="indefinite"/>
 <g fill="#fffaf1" stroke="#746580" stroke-width="1.5">
  <ellipse cx="-11" cy="-23" rx="7" ry="23" transform="rotate(-12 -11 -23)"/>
  <ellipse cx="11" cy="-25" rx="7" ry="25" transform="rotate(13 11 -25)"/>
  <ellipse cy="2" rx="24" ry="21"/>
 </g>
 <g stroke="#d3b7c5" stroke-width="3" stroke-linecap="round"><path d="m-14-36 3 23m26-26-4 24"/></g>
 <g fill="#54495e"><circle cx="-8" cy="0" r="2"/><circle cx="8" cy="0" r="2"/></g>
 <path d="m-2 7 2 2 2-2" fill="none" stroke="#ab8799" stroke-width="1.5" stroke-linecap="round"/>
</g>
<g transform="translate(874 187) rotate(5 86 53)" filter="url(#shadow)">
 <rect width="177" height="106" rx="8" fill="#e7def0" stroke="#746580" stroke-width="1.4"/>
 <path d="M0 25H177" stroke="#746580"/>
 <g fill="#9c88af"><circle cx="13" cy="13" r="3"/><circle cx="25" cy="13" r="3"/><circle cx="37" cy="13" r="3"/></g>
 <rect x="19" y="51" width="138" height="13" rx="4" fill="#f8f5fa" stroke="#b7a6c7"/>
 <rect x="22" y="54" width="28" height="7" rx="2" fill="#9c88af">
  <animate attributeName="width" values="28;126;126;73;89;28" keyTimes="0;.4;.55;.65;.8;1" dur="10s" repeatCount="indefinite"/>
 </rect>
 <path d="M63 83h50" stroke="#b7a6c7" stroke-width="4" stroke-linecap="round"/>
</g>
<g transform="translate(930 54) rotate(9)">
 <rect width="91" height="74" fill="#eee2ad" filter="url(#shadow)"/>
 <rect x="27" y="-6" width="35" height="13" fill="#d4cab3" opacity=".6"/>
 <path d="m20 27 7 7 13-15M49 26h24m-53 24 7 7 13-15M49 49h16" fill="none" stroke="#9e9168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="550" y="167" text-anchor="middle" fill="#403449" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="-2">Maneesha Venigalla</text>
<text x="550" y="208" text-anchor="middle" fill="#746580" font-family="Arial, Helvetica, sans-serif" font-size="21">I build things. Then I build other things.</text>
<path d="M510 239q40-5 80 0" fill="none" stroke="#baa5cc" stroke-width="3" stroke-linecap="round"/>
</svg>
